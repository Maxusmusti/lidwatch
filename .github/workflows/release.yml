name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build CLI (ARM64 release)
        run: swift build -c release --product lidwatch

      - name: Run tests
        run: swift test

      - name: Package binary
        run: |
          mkdir -p dist
          cp .build/release/lidwatch dist/
          cd dist
          tar czf lidwatch-${{ steps.version.outputs.VERSION }}-arm64-macos.tar.gz lidwatch
          shasum -a 256 lidwatch-${{ steps.version.outputs.VERSION }}-arm64-macos.tar.gz > lidwatch-${{ steps.version.outputs.VERSION }}-arm64-macos.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/lidwatch-${{ steps.version.outputs.VERSION }}-arm64-macos.tar.gz
            dist/lidwatch-${{ steps.version.outputs.VERSION }}-arm64-macos.tar.gz.sha256
